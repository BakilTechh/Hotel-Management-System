{% load static %}

<style>
  .nh-navbar {
    background-color: #f5f5f7;
    border-bottom: 1px solid #e2e2e8;
    padding-top: 0.6rem;
    padding-bottom: 0.6rem;
  }
  .nh-nav-link {
    color: #4a4a4a !important;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.5rem 0.2rem !important;
    position: relative;
    transition: color 0.2s ease;
  }
  .nh-nav-link:hover {
    color: #7a0c0c !important;
  }
  .nh-nav-link.active {
    color: #111111 !important;
    font-weight: 600;
  }
  .nh-nav-link.active::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 100%;
    height: 3px;
    background-color: #7a0c0c;
    border-radius: 2px;
  }
  .btn-nh-primary {
    background-color: #7a0c0c;
    color: #ffffff;
    border: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.5rem 1.1rem;
    border-radius: 4px;
    transition: background-color 0.2s;
  }
  .btn-nh-primary:hover {
    background-color: #5c0808;
    color: #ffffff;
  }
  .nh-profile-icon {
    width: 34px;
    height: 34px;
    background-color: #1a1a2e;
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    text-decoration: none;
  }
</style>

<nav class="navbar navbar-expand-lg nh-navbar sticky-top px-3 px-lg-5">
  <div class="container-fluid px-0">
    <a class="navbar-brand d-flex align-items-center py-0 me-4" href="{% url 'home' %}">
      <img src="{% static 'logo.svg' %}" alt="Nocturn Haven Logo" height="38">
    </a>

    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#nhNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nhNavbar">
      <ul class="navbar-nav mx-auto gap-4 align-items-lg-center my-3 my-lg-0">
        <li class="nav-item">
          <a class="nav-link nh-nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nh-nav-link" href="#">Room & Suites</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nh-nav-link" href="#">Facilities</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nh-nav-link" href="#">Offers</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link nh-nav-link dropdown-toggle" href="#" id="aboutDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            About Us
          </a>
          <ul class="dropdown-menu border-0 shadow-sm mt-2">
            <li><a class="dropdown-item py-2 text-secondary" style="font-size: 0.85rem;" href="#">Tentang Kami</a></li>
            <li><a class="dropdown-item py-2 text-secondary" style="font-size: 0.85rem;" href="#">Kontak</a></li>
          </ul>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <a href="#" class="text-decoration-none text-dark fw-medium" style="font-size: 0.88rem;">Masuk</a>
        <a href="#" class="btn btn-nh-primary">Pesan Sekarang</a>
        <a href="#" class="nh-profile-icon" title="Akun Saya">
          <i class="bi bi-person-fill"></i>
        </a>
      </div>
    </div>
  </div>
</nav>
